name: Build iOS App
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build
      - name: Sync Capacitor
        run: |
          npx cap sync ios
      - name: Build iOS IPA (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -allowProvisioningDeviceRegistration -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO CODE_SIGN_STYLE=Manual ONLY_ACTIVE_ARCH=NO
          mkdir -p Payload
          mv build/Debug-iphoneos/App.app Payload/
          zip -r App.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/App/App.ipa
